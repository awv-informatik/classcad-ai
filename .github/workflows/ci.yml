# Monorepo CI: install workspaces, run every package's tests and builds.
# (The .github dirs inside packages/* came from the imported standalone repos
# and are inert here — GitHub only reads this root workflow.)
name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # a run takes minutes: one that hangs fails here instead of after GitHub's six hours
    timeout-minutes: 30
    # The MCP's oldest Node (its README: 20+), and the Node a release is built on (release.yml), which the
    # relay's tests need (wrangler runs on 22 and later; on 20 they are skipped)
    strategy:
      fail-fast: false
      matrix:
        node: [20, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm install
      - run: npm run build
      - run: npm test
        env:
          # an engine key for http://localhost, for the MCP's live engine tests (skipped without it)
          # The live engine tests fetch their keys with a secret access token (classcad.ch/account), or take a key
          CLASSCAD_TOKEN: ${{ secrets.CLASSCAD_TOKEN }}
          CLASSCAD_WASM_KEY: ${{ secrets.CLASSCAD_WASM_KEY }}
